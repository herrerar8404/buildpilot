services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buildpilot}
      POSTGRES_USER: ${POSTGRES_USER:-buildpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildpilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-buildpilot}
      DB_USERNAME: ${POSTGRES_USER:-buildpilot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-buildpilot}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
