spring.application.name=buildpilot

# ==========================================
# PostgreSQL DataSource
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/buildpilot}
spring.datasource.username=${DB_USERNAME:buildpilot}
spring.datasource.password=${DB_PASSWORD:buildpilot}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate
# Flyway is the single source of truth for schema changes.
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# Flyway
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Keep strict validation in all non-dev environments
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
# Prevent accidental destructive operations
spring.flyway.clean-disabled=true

# ==========================================
# HTTP server
# ==========================================
server.port=${SERVER_PORT:8080}

# ==========================================
# SpringDoc / Swagger UI
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
